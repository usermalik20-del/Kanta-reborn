name: GeloKaraoke

options:
  createIntermediateGroups: true

packages:
  GeloKaraokePackage:
    path: .
  ArgmaxSpeech:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0

targets:
  GeloKaraoke:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - README.md
      - path: Sources/Features
        excludes:
          - README.md
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: BG/BUNDLED
        type: folder
        buildPhase: resources
      - path: Resources/CompanionRemote
        type: folder
        buildPhase: resources
      - path: Resources/StarterKaraoke
        type: folder
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: GeloKaraokePackage
        product: GeloKaraokeCore
      - package: GeloKaraokePackage
        product: LibraryStorage
      - package: GeloKaraokePackage
        product: AVFoundationPlayback
      - package: GeloKaraokePackage
        product: AVFoundationMIDIPlayback
      - package: GeloKaraokePackage
        product: LocalNetworkControl
      - package: GeloKaraokePackage
        product: MicrophoneScoring
      - package: ArgmaxSpeech
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gelo.karaoke
        PRODUCT_NAME: KANTA
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/GeloKaraoke-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/KANTA.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

  KantaNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/KantaNativeTests
      # Compile the production component directly without enabling testability in release apps.
      - path: Sources/Features/Host/YouTubeEmbeddedPlayerView.swift
      - path: Sources/Features/Host/KantaIntermissionMusic.swift
    dependencies:
      - target: GeloKaraoke
      - package: GeloKaraokePackage
        product: GeloKaraokeCore
      - package: GeloKaraokePackage
        product: LocalNetworkControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gelo.karaoke.nativetests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KANTA.app/KANTA"
        BUNDLE_LOADER: "$(TEST_HOST)"

  KantaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/KantaUITests
    dependencies:
      - target: GeloKaraoke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gelo.karaoke.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0

schemes:
  GeloKaraoke:
    build:
      targets:
        GeloKaraoke: all
    run:
      config: Debug
    test:
      targets:
        - KantaNativeTests
        - KantaUITests
    archive:
      config: Release
