plugins { id 'com.android.application' }
android {
    namespace 'ph.kanta.reborn'
    compileSdk 36
    ndkVersion "27.2.12479018"
    externalNativeBuild { cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" } }
    defaultConfig {
        applicationId 'ph.kanta.reborn'
        minSdk 26
        targetSdk 36
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        // NDK r27 does not opt into 16 KB ELF alignment by default.
        externalNativeBuild { cmake { arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON" } }
        // CI supplies a monotonically allocated value; local builds retain a safe baseline.
        def kantaVersionCode = providers.gradleProperty('kantaVersionCode').orElse('10').map { value ->
            def parsed = value.toInteger()
            if (parsed < 10 || parsed > 2100000000) throw new GradleException('kantaVersionCode outside bounded release range')
            parsed
        }.get()
        versionCode kantaVersionCode
        // versionName is derived from the same allocation instead of being a frozen
        // literal, so no two previews can share one version again. kantaVersionBase stays on
        // the existing 0.10.0 line until a milestone is actually reached; the build number
        // advances on every CI release. A release may still pin an exact name with
        // -PkantaVersionName. Shape stays within the published [A-Za-z0-9.+-]{1,64} rule.
        def kantaVersionBase = providers.gradleProperty('kantaVersionBase').orElse('0.10.0').get()
        versionName providers.gradleProperty('kantaVersionName').orElse(
            kantaVersionBase + '.' + kantaVersionCode + '-preview'
        ).get()
        testInstrumentationRunner 'ph.kanta.reborn.RuntimeChecks'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        releaseOwner {
            def storePath = System.getenv('KANTA_ANDROID_SIGNING_STORE_FILE')
            def storePasswordValue = System.getenv('KANTA_ANDROID_SIGNING_PASSWORD')
            if (storePath && storePasswordValue) {
                storeFile file(storePath)
                storeType 'pkcs12'
                storePassword storePasswordValue
                keyAlias 'kanta-release'
                keyPassword storePasswordValue
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // CI PR builds remain unsigned; trusted main builds inject the owner key.
            if (System.getenv('KANTA_ANDROID_SIGNING_STORE_FILE') && System.getenv('KANTA_ANDROID_SIGNING_PASSWORD')) {
                signingConfig signingConfigs.releaseOwner
            }
        }
    }
}

// Framework-free domain checks can run before spending emulator/macOS minutes.
def coreClasses = layout.buildDirectory.dir('core-regression-classes')
tasks.register('compileCoreRegression', JavaCompile) {
    source = fileTree('src/main/java') { include 'ph/kanta/reborn/core/**/*.java'; exclude 'ph/kanta/reborn/core/catalog/SqliteSongCatalog.java'; exclude 'ph/kanta/reborn/core/legacy/MegContainerImporter.java'; exclude 'ph/kanta/reborn/core/companion/**' }
    source += fileTree('src/test/java') { include 'ph/kanta/reborn/core/**/*.java' }
    classpath = files()
    destinationDirectory = coreClasses
    options.release = 17
    options.encoding = 'UTF-8'
}
tasks.register('coreRegression', JavaExec) {
    dependsOn 'compileCoreRegression'
    classpath = files(coreClasses)
    mainClass = 'ph.kanta.reborn.core.CoreRegressionTests'
    args file('src/main/assets/starter').absolutePath,
         layout.buildDirectory.file('synthetic-songbook.json').get().asFile.absolutePath
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    // FileProvider and PackageInfoCompat for the OTA updater's install hand-off.
    implementation 'androidx.core:core:1.13.1'
    // Optional pitch DSP adapter. The AAR declares no permissions and pulls in no Google
    // Play services, so the APK keeps its exact CAMERA/RECORD_AUDIO/INTERNET permission set.
    // Same org.tensorflow.lite.Interpreter API, with 16 KB-aligned 64-bit JNI libraries.
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
}

// Keep the exact upstream runtime notices available offline in the app.
def runtimeNotices = layout.buildDirectory.dir('generated/runtime-notices')
android.sourceSets.main.assets.srcDir(runtimeNotices)
def noticesTask = tasks.register('generateRuntimeNotices') {
    inputs.files({ configurations.getByName('releaseRuntimeClasspath') })
    outputs.dir(runtimeNotices)
    doLast {
        def sections = []
        configurations.getByName('releaseRuntimeClasspath').resolvedConfiguration.resolvedArtifacts
            .sort { it.moduleVersion.id.toString() }.each { artifact ->
                def coordinate = artifact.moduleVersion.id.toString()
                sections.add("DEPENDENCY: ${coordinate}\n")
                new java.util.zip.ZipFile(artifact.file).withCloseable { archive ->
                    archive.entries().toList().sort { it.name }.each { entry ->
                        if (!entry.directory && entry.name ==~ /(?i)(.*\/)?(license[^\/]*|notice[^\/]*|al2\.0)/) {
                            if (entry.size > 1048576) throw new GradleException('Oversized runtime notice')
                            archive.getInputStream(entry).withCloseable { input ->
                                byte[] bytes = input.readNBytes(1048577)
                                if (bytes.length > 1048576) throw new GradleException('Oversized runtime notice')
                                sections.add("FILE: ${entry.name}\n" + new String(bytes, java.nio.charset.StandardCharsets.UTF_8) + '\n')
                            }
                        }
                    }
                }
            }
        def destination = runtimeNotices.get().file('runtime-notices.txt').asFile
        destination.parentFile.mkdirs()
        destination.text = sections.join('\n')
    }
}
tasks.named('preBuild').configure { dependsOn noticesTask }

// Lint stays fully enabled. A separate exact-finding debt inventory rejects new
// warnings without hiding existing warnings from the normal HTML/XML reports.
// Python 3 is required for local APK builds as well as hosted validation.
def repositoryRoot = rootProject.projectDir.parentFile.parentFile
def lintContracts = tasks.register('verifyAndroidLintContracts', Exec) {
    workingDir repositoryRoot
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-p', 'test_android_lint*.py'
}
['Debug', 'Release'].each { variant ->
    def reportName = variant.toLowerCase(java.util.Locale.ROOT)
    def lintGate = tasks.register("verify${variant}LintDebt", Exec) {
        dependsOn "lint${variant}"
        dependsOn lintContracts
        workingDir repositoryRoot
        commandLine 'python3', new File(repositoryRoot, 'tools/verify-android-lint.py'),
            layout.buildDirectory.file("reports/lint-results-${reportName}.xml").get().asFile
    }
    tasks.configureEach { task ->
        if (task.name == "assemble${variant}" || task.name == "bundle${variant}") {
            task.dependsOn lintGate
        }
        if (task.name == "assemble${variant}") {
            task.doLast {
                // Inspect ELF PT_LOAD segments in the packaged artifact, not just ZIP offsets.
                def apkDirectory = layout.buildDirectory.dir("outputs/apk/${reportName}").get().asFile
                def apks = fileTree(apkDirectory) { include '*.apk' }.files
                if (apks.empty) throw new GradleException('No assembled APK for alignment validation')
                apks.each { apk ->
                    project.exec {
                        workingDir repositoryRoot
                        commandLine 'python3', new File(repositoryRoot, 'tools/verify-android-native-alignment.py'), apk
                    }
                }
            }
        }
    }
}
