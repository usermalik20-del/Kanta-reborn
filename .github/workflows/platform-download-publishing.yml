name: Platform-specific verified download publishing
on:
  workflow_run:
    workflows:
      - KANTA Android validation
      - KANTA iOS unsigned artifacts
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: platform-download-publishing
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          (github.event.workflow_run.name == 'KANTA Android validation' ||
           github.event.workflow_run.name == 'KANTA iOS unsigned artifacts') }}
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      PLATFORM: ${{ github.event.workflow_run.name == 'KANTA Android validation' && 'android' || 'ios' }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Package only the completed platform build
        run: python3 tools/prepare-platform-download.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PLATFORM == 'android' && 'KANTA-Android-preview-download' || 'KANTA-iOS-personal-unsigned-download' }}
          path: verified-downloads/${{ env.PLATFORM }}/*
          if-no-files-found: error
          retention-days: 30
      - name: Put the Android build tools on PATH
        if: env.PLATFORM == 'android'
        run: |
          set -euo pipefail
          # tools/verify-ota-publication.py shells out to aapt and apksigner. A GitHub
          # runner ships them under $ANDROID_HOME/build-tools but does not expose that
          # directory, so verification collapsed into "APK metadata command failed".
          # Fail here with the real reason instead of one line further down.
          tools_dir="$(ls -d "${ANDROID_HOME:?ANDROID_HOME is not set}"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "${tools_dir}" ]; then
            echo "::error::No Android build-tools under ${ANDROID_HOME}"
            exit 1
          fi
          for binary in aapt apksigner; do
            if [ ! -x "${tools_dir}/${binary}" ]; then
              echo "::error::${binary} is missing from ${tools_dir}"
              exit 1
            fi
          done
          echo "${tools_dir}" >> "${GITHUB_PATH}"
          echo "Android build tools: ${tools_dir}"
      - name: Verify APK metadata and signer continuity
        if: env.PLATFORM == 'android'
        run: |
          set -euo pipefail
          apk="$(python3 -c 'from pathlib import Path; print(next(Path("verified-downloads/android").glob("*.apk")))')"
          python3 tools/verify-ota-publication.py "$apk" \
            --previous-feed apps/web/updates.json \
            --output verified-downloads/android/apk-metadata.json \
            --expected-version-code "${SOURCE_RUN_NUMBER}" --source "${SOURCE_SHA}"
      - name: Ensure an immutable durable release asset
        if: env.PLATFORM == 'android'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(python3 -c 'from pathlib import Path; print(next(Path("verified-downloads/android").glob("*.apk")))')"
          version="$(python3 -c 'import json; print(json.load(open("verified-downloads/android/apk-metadata.json"))["versionName"].split("-")[0])')"
          tag="v${version}-preview-${SOURCE_SHA:0:8}"
          digest="$(sha256sum "$apk" | cut -d' ' -f1)"
          for attempt in 1 2 3; do
            if ! gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets >/tmp/release.json 2>/dev/null; then
              gh release create "$tag" "$apk" --title "KANTA Android preview ${SOURCE_SHA:0:8}" --notes "Verified CI build ${SOURCE_SHA:0:8}. Durable OTA artifact." --repo "${GITHUB_REPOSITORY}" && break
            fi
            asset="$(jq -r --arg n "$(basename "$apk")" '.assets[] | select(.name==$n) | .digest // empty' /tmp/release.json)"
            test -n "$asset" && test "${asset#sha256:}" = "$digest" && break
            test -z "$asset" || { echo 'existing release asset differs; immutable publication refused' >&2; exit 1; }
            gh release upload "$tag" "$apk" --repo "${GITHUB_REPOSITORY}" && break
            sleep $((attempt * 2))
          done
          gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets | jq -e --arg n "$(basename "$apk")" --arg d "sha256:$digest" '.assets[] | select(.name==$n and .digest==$d)' >/dev/null
      - name: Publish only this platform's manifest and page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          artifact="$(printf '%s' "${artifacts}" | jq -ce --arg name "${PLATFORM}" '
            [.artifacts[] | select(.name == (if $name == "android" then "KANTA-Android-preview-download" else "KANTA-iOS-personal-unsigned-download" end))]
            | sort_by(.created_at)
            | last // error("no matching platform package artifact")')"
          test -n "${artifact}"
          PACKAGE_ARTIFACT_ID="$(printf '%s' "${artifact}" | jq -r '.id')"
          PACKAGE_ARTIFACT_SHA256="$(printf '%s' "${artifact}" | jq -r '.digest')"
          PACKAGE_CREATED_AT="$(printf '%s' "${artifact}" | jq -r '.created_at')"
          PACKAGE_EXPIRES_AT="$(printf '%s' "${artifact}" | jq -r '.expires_at')"
          export PACKAGE_ARTIFACT_ID PACKAGE_ARTIFACT_SHA256 PACKAGE_CREATED_AT PACKAGE_EXPIRES_AT
          python3 tools/publish-platform-download.py
          if [ "${PLATFORM}" = android ]; then python3 tools/prepare-update-feed.py; fi
          python3 tools/verify-website.py
          python3 -m unittest tools.tests.test_website_security_contract
          git add apps/web/downloads.json
          # Stage only the page owned by this platform; the OTA feed follows Android only.
          if [ "${PLATFORM}" = android ]; then
            git add apps/web/android.html apps/web/updates.json
          else
            git add apps/web/ios-download.html
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(downloads): publish verified ${PLATFORM} build"
          git push origin HEAD:main
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vercel-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
