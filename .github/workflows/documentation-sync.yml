name: KANTA documentation sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: documentation-sync-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  documentation-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check implementation-to-documentation synchronization
        env:
          DOC_SYNC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOC_SYNC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m unittest tools.tests.test_documentation_sync
          python3 tools/check-documentation-sync.py "$DOC_SYNC_BASE" "$DOC_SYNC_HEAD"
