name: KANTA Daily CI
# Nightly health sweep, not a release pipeline: this workflow answers one
# question — "is main healthy?" — and never signs, publishes, or dispatches
# the verified-download publisher (reusable calls run inside this workflow's
# run, so the publisher's workflow_run filter never matches this run name).
on:
  schedule:
    # 03:17 UTC (11:17 AM Philippines) — deliberately off the top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Queue overlapping daily runs; never cancel one in progress.
  group: kanta-daily-ci
  cancel-in-progress: false
jobs:
  # Fast, cheap gates run alongside the native deep gates: any deterministic
  # gate failing turns the whole run red, with no automatic rerun — a flaky
  # failure is itself information.
  website:
    name: Website fast gate
    uses: ./.github/workflows/website-validation.yml
  contracts:
    name: Download and release contracts gate
    uses: ./.github/workflows/verified-downloads.yml
  android:
    name: Android deep gate
    uses: ./.github/workflows/android-validation.yml
    with:
      # Health runs validate only: release signing and BLA hardening stay off.
      daily_health: true
  ios:
    name: iOS simulator gate
    uses: ./.github/workflows/ios-validation.yml
