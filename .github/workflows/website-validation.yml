name: KANTA website validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/ios/PRIVACY.md'
      - 'apps/ios/PublicSite/**'
      - 'apps/android/app/src/main/assets/privacy.txt'
      - 'tools/verify-website.py'
      - 'tools/tests/test_vercel_deploy_workflow.py'
      - 'tools/tests/test_website_security_contract.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/web/**'
      - 'tools/verify-website.py'
      - 'tools/tests/test_vercel_deploy_workflow.py'
      - 'tools/tests/test_website_security_contract.py'
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  website:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 tools/verify-website.py
      - run: python3 -m unittest tools.tests.test_vercel_deploy_workflow tools.tests.test_website_security_contract
      - run: python3 -m unittest discover -s apps/ios/Tests/ReleaseToolingTests -p 'test_customer_legal_copy.py'
      - run: node --check apps/web/songbook.js
      - run: node --check apps/web/api/page.js
      - run: node --check apps/web/site-consent.js
      - run: node --test tools/tests/test_site_page_handler.test.js
      - run: node --check apps/web/analytics.js
