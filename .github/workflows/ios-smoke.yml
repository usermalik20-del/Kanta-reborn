name: KANTA iOS focused simulator smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'apps/android/**'
      - 'tools/check-ios-presentation-contract.py'
      - 'tools/verify-ios-smoke-results.py'
      - 'tools/verify-test-layout.py'
      - 'tools/verify-android-companion-interface.py'
      - '.github/workflows/ios-smoke.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/ios/**'
      - 'apps/android/**'
      - 'tools/check-ios-presentation-contract.py'
      - 'tools/verify-ios-smoke-results.py'
      - 'tools/verify-test-layout.py'
      - 'tools/verify-android-companion-interface.py'
      - '.github/workflows/ios-smoke.yml'
permissions:
  contents: read
concurrency:
  group: ios-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ios-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build host, native lifecycle tests and UI test bundle
        run: |
          set -o pipefail
          python3 ../../tools/check-ios-presentation-contract.py
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          xcodebuild build-for-testing -project GeloKaraoke.xcodeproj -scheme GeloKaraoke -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES 2>&1 | tee smoke-build.log
      - name: Run native lifecycle tests and focused iPhone smoke
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone") and x.get("isAvailable",True)))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test-without-building -project GeloKaraoke.xcodeproj -scheme GeloKaraoke -configuration Release -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData -resultBundlePath smoke.xcresult -parallel-testing-enabled NO -only-testing:KantaNativeTests -only-testing:KantaUITests/KantaVisualWalkthroughUITests/testFocusedNavigationSmoke -only-testing:KantaUITests/KantaVisualWalkthroughUITests/testBrowserCompanionRoleAndInputRejection -only-testing:KantaUITests/KantaVisualWalkthroughUITests/testOnlinePreviewEntryCloseReopenAndForegroundLifecycle -only-testing:KantaUITests/KantaVisualWalkthroughUITests/testOnlinePreviewPreservesPausedStarterAndLocalResume CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES 2>&1 | tee smoke-tests.log
          python3 ../../tools/verify-ios-smoke-results.py smoke-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-focused-smoke-evidence
          path: |
            apps/ios/smoke-build.log
            apps/ios/smoke-tests.log
            apps/ios/smoke.xcresult/**
          if-no-files-found: ignore
          retention-days: 7
