name: KANTA workflow contract validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/tests/test_workflow_path_ownership.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - 'tools/tests/test_workflow_path_ownership.py'
permissions:
  contents: read
concurrency:
  group: workflow-contracts-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify independent workflow ownership and trigger routing
        run: python3 -m unittest tools.tests.test_workflow_path_ownership
