name: KANTA Vercel deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'tools/verify-website.py'
      - 'tools/check-product-branding.py'
      - 'tools/tests/test_vercel_deploy_workflow.py'
      - 'tools/tests/test_website_security_contract.py'
      - '.github/workflows/vercel-deploy.yml'
      - '.github/workflows/website-validation.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/web/**'
      - 'tools/verify-website.py'
      - 'tools/check-product-branding.py'
      - 'tools/tests/test_vercel_deploy_workflow.py'
      - 'tools/tests/test_website_security_contract.py'
      - '.github/workflows/vercel-deploy.yml'
      - '.github/workflows/website-validation.yml'
permissions:
  contents: read
concurrency:
  group: vercel-deploy-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate website and deployment contract
        run: |
          python3 tools/check-product-branding.py
          python3 tools/verify-website.py
          python3 -m unittest tools.tests.test_vercel_deploy_workflow tools.tests.test_website_security_contract
          node --check apps/web/songbook.js
          node --check apps/web/analytics.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_6rrG5QXBI00wEFufnjKSJLWj
      VERCEL_PROJECT_ID: prj_OG4AuuRqXOY9EAPRJuSvnT3UXvA6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: "65.2.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify existing project target and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "::error::Missing GitHub Actions secret VERCEL_TOKEN"
            exit 1
          fi
          test "${VERCEL_ORG_ID}" = "team_6rrG5QXBI00wEFufnjKSJLWj"
          test "${VERCEL_PROJECT_ID}" = "prj_OG4AuuRqXOY9EAPRJuSvnT3UXvA6"
      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Confirm Vercel CLI version
        run: vercel --version
      # Run from the repository root: the Vercel project's configured Root Directory is apps/web.
      # Running inside apps/web makes Vercel resolve the project path as apps/web/apps/web.
      - name: Pull existing production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production output
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
