name: KANTA Vercel deploy
on:
  workflow_dispatch:
    inputs:
      configure_domain:
        description: Domain to add to the Vercel project (e.g. kanta.is-a.bot)
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'tools/verify-website.py'
      - 'tools/tests/test_vercel_deploy_workflow.py'
      - 'tools/tests/test_website_security_contract.py'
      - '.github/workflows/vercel-deploy.yml'
      - '.github/workflows/website-validation.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/web/**'
      - 'tools/verify-website.py'
      - 'tools/tests/test_vercel_deploy_workflow.py'
      - 'tools/tests/test_website_security_contract.py'
      - '.github/workflows/vercel-deploy.yml'
      - '.github/workflows/website-validation.yml'
      - '.github/workflows/website-validation.yml'
permissions:
  contents: read
concurrency:
  group: vercel-deploy-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate website and deployment contract
        run: |
          python3 tools/verify-website.py
          python3 -m unittest tools.tests.test_vercel_deploy_workflow tools.tests.test_website_security_contract
          node --check apps/web/songbook.js

  deploy:
    # Gate on the event name as well as the input: on a push event the `inputs` context is
    # null rather than an empty string, so `inputs.configure_domain != ''` alone would be
    # true and would run the domain step (or skip the deploy steps) on a normal release.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.configure_domain != ''))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_6rrG5QXBI00wEFufnjKSJLWj
      VERCEL_PROJECT_ID: prj_OG4AuuRqXOY9EAPRJuSvnT3UXvA6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: "65.2.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify existing project target and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "::error::Missing GitHub Actions secret VERCEL_TOKEN"
            exit 1
          fi
          test "${VERCEL_ORG_ID}" = "team_6rrG5QXBI00wEFufnjKSJLWj"
          test "${VERCEL_PROJECT_ID}" = "prj_OG4AuuRqXOY9EAPRJuSvnT3UXvA6"
      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Confirm Vercel CLI version
        run: vercel --version
      - name: Configure requested Vercel domain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_domain != '' }}
        shell: bash
        env:
          CONFIGURE_DOMAIN: ${{ inputs.configure_domain }}
        run: |
          set -euo pipefail
          test -n "${CONFIGURE_DOMAIN}"
          response="$(curl -sS -w '\n%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" \
            --data "{\"name\":\"${CONFIGURE_DOMAIN}\"}")"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          printf '%s\n' "$body" > /tmp/vercel-domain-assignment.json
          if [[ "$status" != "200" && "$status" != "201" && "$status" != "409" ]]; then
            echo "::error::Vercel domain request failed with HTTP ${status}"
            cat /tmp/vercel-domain-assignment.json
            exit 1
          fi
          echo "Vercel domain assignment response:"
          cat /tmp/vercel-domain-assignment.json
      # Run from the repository root: the Vercel project's configured Root Directory is apps/web.
      # Running inside apps/web makes Vercel resolve the project path as apps/web/apps/web.
      - name: Pull existing production project settings
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.configure_domain == '' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production output
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.configure_domain == '' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt output to production
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.configure_domain == '' }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
