name: Automated CI failure triage
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Failed workflow run ID to investigate'
        required: true
        type: string
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: failure-triage-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
      RUN_SHA: resolved-from-run
      WORKFLOW_NAME: owner-requested-investigation
    steps:
      - name: Create or update failure investigation
        shell: bash
        run: |
          set -euo pipefail
          RUN_SHA=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)
          WORKFLOW_NAME=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .name)
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name + ": " + .html_url' > failed-jobs.txt
          if [ ! -s failed-jobs.txt ]; then echo "- No failed job returned by GitHub API" > failed-jobs.txt; fi
          key="[CI failure] $WORKFLOW_NAME"
          issue=$(gh issue list --state open --limit 100 --json number,title --jq "[.[] | select(.title == \"$key\") | .number] | first // empty")
          {
            printf 'Automated failure report. Investigate the root cause; do not bypass assertions or disable tests.\n\n'
            printf '**Workflow:** %s\n**Run:** %s\n**Commit:** `%s`\n\n' "$WORKFLOW_NAME" "$RUN_URL" "$RUN_SHA"
            printf '**Failed jobs:**\n'
            cat failed-jobs.txt
            printf '\n**Repair gate:** Add a regression test, validate iOS and Android where affected, and merge only after required checks pass.\n'
          } > failure.md
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file failure.md
          else
            gh issue create --title "$key" --body-file failure.md
          fi
