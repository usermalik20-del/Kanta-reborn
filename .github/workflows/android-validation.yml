name: KANTA Android validation
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to validate (defaults to the event commit)'
        required: false
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'tools/check-product-branding.py'
      - 'tools/verify-android-runtime-package.py'
      - 'tools/verify-companion-browser.mjs'
      - 'tools/verify-songbook-browser-interop.mjs'
      - 'tools/verify-android-companion-interface.py'
      - 'tools/run-android-runtime.py'
      - 'tools/tests/test_prompt_bank.py'
      - 'tools/tests/test_android_*.py'
      - 'tools/tests/test_companion_*.py'
      - 'tools/prepare-verified-downloads.py'
      - 'tools/publish-verified-downloads.py'
      - 'tools/tests/test_verified_downloads.py'
      - 'tools/tests/test_publish_verified_downloads.py'

  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/android/**'
      - 'tools/check-product-branding.py'
      - 'tools/verify-android-runtime-package.py'
      - 'tools/verify-companion-browser.mjs'
      - 'tools/verify-songbook-browser-interop.mjs'
      - 'tools/verify-android-companion-interface.py'
      - 'tools/run-android-runtime.py'
      - 'tools/tests/test_prompt_bank.py'
      - 'tools/tests/test_android_*.py'
      - 'tools/tests/test_companion_*.py'

permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.run_attempt }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Steps will be limited based on mode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Enforce documentation synchronization before release
        if: github.event_name == 'push'
        working-directory: .
        env:
          DOC_SYNC_BASE: ${{ github.event.before }}
          DOC_SYNC_HEAD: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          base="${DOC_SYNC_BASE:-$(git rev-parse "${DOC_SYNC_HEAD}^")}"
          python3 tools/check-documentation-sync.py "$base" "$DOC_SYNC_HEAD"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify KANTA product branding
        run: python3 tools/check-product-branding.py
      - name: Verify prompt bank contract
        run: python3 -m unittest tools.tests.test_prompt_bank
      - name: Verify Android runtime runner control flow
        run: python3 -m unittest tools.tests.test_android_runtime_runner
      - name: Install required Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Native SoundFont sanitizer regression
        run: |
          cc -D_POSIX_C_SOURCE=200809L -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer apps/android/tests/soundfont-test.c -lm -o /tmp/kanta-soundfont-test
          /tmp/kanta-soundfont-test apps/android/app/src/main/assets/starter/kanta-tone.sf2
      - name: Build, lint and domain regression tests
        id: build
        working-directory: apps/android
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath :app:assembleDebug :app:lintDebug :app:coreRegression :app:assembleDebugAndroidTest 2>&1 | tee build.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-failure-log
          path: apps/android/build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify camera permission and offline notices
        run: python3 tools/verify-android-runtime-package.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify HTTPS companion in real Chrome
        timeout-minutes: 3
        env:
          KANTA_BROWSER_SCREENSHOT: browser-remote.png
        run: node tools/verify-companion-browser.mjs
      - name: Verify captured browser interoperability
        run: node tools/verify-songbook-browser-interop.mjs apps/android/app/build/synthetic-songbook.json docs/evidence/website/2026-10-15/songbook.js
      - name: Verify companion private IPv4 interface selection
        run: python3 tools/verify-android-companion-interface.py
      - name: Android emulator runtime checks
        timeout-minutes: 15
        run: python3 tools/run-android-runtime.py
      - name: Preserve Android runtime diagnostics
        if: always()
        run: |
          if [ ! -s android-logcat.log ]; then
            timeout 20s "$ANDROID_HOME/platform-tools/adb" logcat -d > android-logcat.log 2>&1 || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reconstruction-checks
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/lint-results-debug.*
            apps/android/app/build/outputs/apk/androidTest/debug/*.apk
            android-runtime.log
            android-logcat.log
            android-runtime-stage.png
            android-runtime-camera.png
            # UI walkthrough screenshots captured by RuntimeChecks.java
            files/library_ready.png
            files/fixture_loaded.png
            files/ui_rendered.png
            files/youtube_loaded.png
            files/stage_ready.png
            files/camera_optin.png
            files/voice_settings.png
            files/final_ui.png
            browser-remote.png
            emulator.log
          if-no-files-found: ignore
          retention-days: 7
