name: Verified download packaging
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main-branch commit SHA to package; defaults to the dispatch ref.
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'tools/prepare-verified-downloads.py'
      - 'tools/publish-verified-downloads.py'
      - 'tools/tests/test_verified_downloads.py'
      - 'tools/tests/test_publish_verified_downloads.py'
      - '.github/workflows/verified-downloads.yml'
      - '.github/workflows/ios-runtime-artifacts.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/prepare-verified-downloads.py'
      - 'tools/publish-verified-downloads.py'
      - 'tools/tests/test_verified_downloads.py'
      - 'tools/tests/test_publish_verified_downloads.py'
      - '.github/workflows/verified-downloads.yml'
      - '.github/workflows/ios-runtime-artifacts.yml'
  workflow_run:
    workflows: ["KANTA iOS unsigned artifacts"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: verified-downloads-${{ github.event.workflow_run.head_sha || inputs.source_sha || github.sha }}
  cancel-in-progress: false
jobs:
  contracts:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check exact-SHA artifact and release-gate contracts
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_verified_downloads.py'
          python3 -m unittest discover -s tools/tests -p 'test_publish_verified_downloads.py'
  package:
    permissions:
      contents: write
      actions: write
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.name == 'KANTA iOS unsigned artifacts') }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Package exact-SHA accepted builds
        run: python3 tools/prepare-verified-downloads.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KANTA-Android-preview-download
          path: verified-downloads/android/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KANTA-iOS-personal-unsigned-download
          path: verified-downloads/ios/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KANTA-verified-download-manifest
          path: verified-downloads/downloads.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified download manifest and platform links
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          android_id="$(printf '%s' "${artifacts}" | jq -r '.artifacts[] | select(.name == "KANTA-Android-preview-download") | .id')"
          ios_id="$(printf '%s' "${artifacts}" | jq -r '.artifacts[] | select(.name == "KANTA-iOS-personal-unsigned-download") | .id')"
          android_digest="$(printf '%s' "${artifacts}" | jq -r '.artifacts[] | select(.name == "KANTA-Android-preview-download") | .digest')"
          ios_digest="$(printf '%s' "${artifacts}" | jq -r '.artifacts[] | select(.name == "KANTA-iOS-personal-unsigned-download") | .digest')"
          test -n "${android_id}" && test "${android_id}" != "null"
          test -n "${ios_id}" && test "${ios_id}" != "null"
          test -n "${android_digest}" && test "${android_digest}" != "null"
          test -n "${ios_digest}" && test "${ios_digest}" != "null"
          VERIFIED_AT="$(date -u +%F)" ANDROID_PACKAGE_ARTIFACT_ID="${android_id}" IOS_PACKAGE_ARTIFACT_ID="${ios_id}" ANDROID_PACKAGE_ARTIFACT_SHA256="${android_digest}" IOS_PACKAGE_ARTIFACT_SHA256="${ios_digest}" python3 tools/publish-verified-downloads.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/downloads.json apps/web/android.html apps/web/ios-download.html
          git diff --cached --check
          git commit -m "chore(downloads): publish verified exact-SHA builds"
          git push origin HEAD:main
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vercel-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
