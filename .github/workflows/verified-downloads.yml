name: Verified download contracts
on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare-verified-downloads.py'
      - 'tools/publish-verified-downloads.py'
      - 'tools/prepare-platform-download.py'
      - 'tools/publish-platform-download.py'
      - 'tools/tests/test_verified_downloads.py'
      - 'tools/tests/test_publish_verified_downloads.py'
      - 'tools/tests/test_platform_download_publishing.py'
      - '.github/workflows/**'
      - 'tools/tests/test_workflow_path_ownership.py'
      - 'tools/check-documentation-sync.py'
      - 'tools/tests/test_documentation_sync.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/prepare-verified-downloads.py'
      - 'tools/publish-verified-downloads.py'
      - 'tools/prepare-platform-download.py'
      - 'tools/publish-platform-download.py'
      - 'tools/tests/test_verified_downloads.py'
      - 'tools/tests/test_publish_verified_downloads.py'
      - 'tools/tests/test_platform_download_publishing.py'
      - '.github/workflows/**'
      - 'tools/tests/test_workflow_path_ownership.py'
permissions:
  contents: read
concurrency:
  group: verified-download-contracts-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce documentation synchronization before packaging
        if: github.event_name == 'push'
        env:
          DOC_SYNC_BASE: ${{ github.event.before }}
          DOC_SYNC_HEAD: ${{ github.sha }}
        run: |
          base="${DOC_SYNC_BASE:-$(git rev-parse "${DOC_SYNC_HEAD}^")}"
          python3 tools/check-documentation-sync.py "$base" "$DOC_SYNC_HEAD"
      - name: Check platform-specific packaging and workflow contracts
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_verified_downloads.py'
          python3 -m unittest discover -s tools/tests -p 'test_publish_verified_downloads.py'
          python3 -m unittest tools.tests.test_platform_download_publishing
          python3 -m unittest tools.tests.test_workflow_path_ownership tools.tests.test_documentation_sync
