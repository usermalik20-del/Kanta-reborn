name: KANTA iOS validation
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'apps/ios/**'
      - 'tools/**'
      - '.github/workflows/ios-validation.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/ios/**'
      - 'tools/**'
      - '.github/workflows/ios-validation.yml'
permissions:
  contents: read
concurrency:
  group: ios-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android companion interoperability host
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/kanta-kcp"
          javac -d "$RUNNER_TEMP/kanta-kcp" apps/android/app/src/main/java/ph/kanta/reborn/core/CompanionProtocol.java tools/tests/CompanionInteropHost.java
          echo "KANTA_KCP_TEST_CLASSES=$RUNNER_TEMP/kanta-kcp" >> "$GITHUB_ENV"
      - name: Tool versions and source guards
        run: |
          xcodebuild -version
          swift --version
          python3 ../../tools/verify-test-layout.py
          python3 ../../tools/check-ios-presentation-contract.py
          python3 -m unittest discover -s Tests/ReleaseToolingTests
          python3 -m unittest discover -s Tests -p test_starter_kar_generator.py
          python3 Tools/verify-starter-resources.py
      - name: Compile Swift package and test targets
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee swift-test-build.log
      - name: Swift package tests
        run: |
          set -o pipefail
          date +%s > swift-tests-start.txt
          swift test --skip-build --no-parallel 2>&1 | tee swift-test-results.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-package-diagnostics
          path: apps/ios/swift-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Unsigned simulator build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          xcodebuild -project GeloKaraoke.xcodeproj -scheme GeloKaraoke -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee simulator-build.log

      - name: Collect package crash reports
        if: always()
        run: python3 ../../tools/collect-swift-test-crashes.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-reconstruction-diagnostics
          path: |
            apps/ios/*.log
            apps/ios/swift-test-crashes/*
          if-no-files-found: ignore
          retention-days: 7
